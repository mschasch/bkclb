<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buchclub Voting</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.hidden{
    display:none;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#1d4ed8;
}

input[type=email],
input[type=password]{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:6px;
}

.success{
    color:green;
}

.error{
    color:red;
}

canvas{
    max-height:350px;
}

</style>

</head>
<body>

<h1>📚 Buchclub Abstimmung</h1>

<div id="loginCard" class="card">

    <h2>Anmeldung</h2>

    <label>E-Mail</label>
    <input id="email" type="email">

    <label>Passwort</label>
    <input id="password" type="password">

    <button onclick="login()">
        Anmelden
    </button>

    <p id="loginMessage"></p>

</div>

<div id="voteCard" class="card hidden">

    <h2>Buchauswahl</h2>

    <label>
        <input type="checkbox" class="book" value="Dune">
        Dune
    </label><br>

    <label>
        <input type="checkbox" class="book" value="Der Name des Windes">
        Der Name des Windes
    </label><br>

    <label>
        <input type="checkbox" class="book" value="Die drei Sonnen">
        Die drei Sonnen
    </label>

    <hr>

    <h2>Terminwahl</h2>

    <label>
        <input type="checkbox" class="date" value="12.12.2026">
        12.12.2026
    </label><br>

    <label>
        <input type="checkbox" class="date" value="19.12.2026">
        19.12.2026
    </label><br>

    <label>
        <input type="checkbox" class="date" value="09.01.2027">
        09.01.2027
    </label><br>

    <label>
        <input type="checkbox" class="date" value="16.01.2027">
        16.01.2027
    </label><br>

    <label>
        <input type="checkbox" class="date" value="23.01.2027">
        23.01.2027
    </label>

    <br><br>

    <button onclick="saveVote()">
        Abstimmung speichern
    </button>

    <button onclick="logout()">
        Abmelden
    </button>

    <p id="voteMessage"></p>

</div>

<div id="resultsCard" class="card hidden">

    <h2>📊 Aktueller Stand</h2>

    <h3>Bücher</h3>
    <canvas id="booksChart"></canvas>

    <br><br>

    <h3>Termine</h3>
    <canvas id="datesChart"></canvas>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyD280p-RuyGrNiOlUJ1k2yJw25RV8oxEKQ",
  authDomain: "bkclb-voting.firebaseapp.com",
  projectId: "bkclb-voting",
  storageBucket: "bkclb-voting.firebasestorage.app",
  messagingSenderId: "949236669090",
  appId: "1:949236669090:web:31e39a3ed8c0fffe6bd5fb"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let booksChart = null;
let datesChart = null;

window.login = async function(){

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch{

        document.getElementById("loginMessage").innerHTML =
            "<span class='error'>Anmeldung fehlgeschlagen</span>";

    }
};

window.logout = async function(){

    await signOut(auth);

};

window.saveVote = async function(){

    const user = auth.currentUser;

    const books =
        [...document.querySelectorAll(".book:checked")]
        .map(el => el.value);

    const dates =
        [...document.querySelectorAll(".date:checked")]
        .map(el => el.value);

    try{

        await setDoc(
            doc(db,"votes",user.uid),
            {
                books,
                dates,
                updatedAt:new Date().toISOString()
            }
        );

        document.getElementById("voteMessage").innerHTML =
            "<span class='success'>✓ gespeichert</span>";

        await loadResults();

    }
    catch{

        document.getElementById("voteMessage").innerHTML =
            "<span class='error'>Speichern fehlgeschlagen</span>";

    }

};

async function loadUserVote(user){

    const voteRef =
        doc(db,"votes",user.uid);

    const voteDoc =
        await getDoc(voteRef);

    if(!voteDoc.exists()) return;

    const data = voteDoc.data();

    document
      .querySelectorAll(".book")
      .forEach(box =>
        box.checked =
          data.books?.includes(box.value)
      );

    document
      .querySelectorAll(".date")
      .forEach(box =>
        box.checked =
          data.dates?.includes(box.value)
      );

}

async function loadResults(){

    const snapshot =
        await getDocs(
            collection(db,"votes")
        );

    const books = {
        "Dune":0,
        "Der Name des Windes":0,
        "Die drei Sonnen":0
    };

    const dates = {
        "12.12.2026":0,
        "19.12.2026":0,
        "09.01.2027":0,
        "16.01.2027":0,
        "23.01.2027":0
    };

    snapshot.forEach(doc => {

        const vote = doc.data();

        vote.books?.forEach(book => {
            books[book]++;
        });

        vote.dates?.forEach(date => {
            dates[date]++;
        });

    });

    if(booksChart){
        booksChart.destroy();
    }

    if(datesChart){
        datesChart.destroy();
    }

    booksChart = new Chart(
        document.getElementById("booksChart"),
        {
            type: "bar",
            data: {
                labels: Object.keys(books),
                datasets: [{
                    label: "Stimmen",
                    data: Object.values(books),
                    backgroundColor: "#2563eb"
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero:true
                    }
                }
            }
        }
    );

    datesChart = new Chart(
        document.getElementById("datesChart"),
        {
            type: "bar",
            data: {
                labels: Object.keys(dates),
                datasets: [{
                    label: "Verfügbarkeiten",
                    data: Object.values(dates),
                    backgroundColor: "#16a34a"
                }]
            },
            options: {
                responsive:true,
                scales:{
                    y:{
                        beginAtZero:true
                    }
                }
            }
        }
    );

}

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        document.getElementById("loginCard")
            .classList.remove("hidden");

        document.getElementById("voteCard")
            .classList.add("hidden");

        document.getElementById("resultsCard")
            .classList.add("hidden");

        return;
    }

    document.getElementById("loginCard")
        .classList.add("hidden");

    document.getElementById("voteCard")
        .classList.remove("hidden");

    document.getElementById("resultsCard")
        .classList.remove("hidden");

    await loadUserVote(user);
    await loadResults();

});

</script>

</body>
</html>
